name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          AAA622: ${{ secrets.AAA622 }}
          B0D8A7: ${{ secrets.B0D8A7 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('AAA622', '')
          k2 = os.environ.get('B0D8A7', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- 9039bd6af415ac65836fa88f7010141a3011f71f96cf -->', k1) if k1 else txt
          out = out.replace('<!-- d307291a252c3ec487e39c -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
